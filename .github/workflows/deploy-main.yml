name: Deploy Backend (MAIN)

# Vilar tills main-branchen skapas (Dag 5). Endast dev-branch finns i
# nuläget, så denna workflow triggas inte förrän main pushas.
#
# Secrets som krävs i detta repo (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME        — Docker Hub-användarnamn
#   DOCKERHUB_TOKEN           — Docker Hub Access Token
#   RAILWAY_DEPLOY_HOOK_MAIN  — Deploy Trigger-URL för backend MAIN-servicen på Railway

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/number-guess-backend-main:latest

      - name: Trigger deployment on Railway (main)
        run: curl -X POST ${{ secrets.RAILWAY_DEPLOY_HOOK_MAIN }}
