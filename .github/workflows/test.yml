name: Backend Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          MYSQL_DATABASE: localdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p${{ secrets.TEST_DB_PASSWORD }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout kod
        uses: actions/checkout@v7

      - name: Sätt upp Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Bygg (kompilera)
        run: ./mvnw -B clean compile

      - name: Kör tester (unit + integration)
        run: ./mvnw -B verify
        env:
          DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
