name: Deploy Backend (DEV)

on:
  push:
    branches: [dev]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/number-guess-backend:dev

      - name: List Railway services
        run: npx -y @railway/cli@latest service list
        env:
            RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Trigger deployment on Railway (dev)
        run: npx -y @railway/cli@latest redeploy --service backend-dev --yes
        env:
            RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
